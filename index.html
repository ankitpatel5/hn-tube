<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HN Tube</title>
  <meta name="description" content="The most upvoted videos on Hacker News over the past year, sorted by category and popularity. Updated daily.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    // Apply the saved theme before first paint so dark mode never flashes white.
    try {
      const t = JSON.parse(localStorage.getItem('hn-tube:prefs'))?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-start">
      <button class="icon-btn" id="menu-btn" type="button" aria-label="Toggle sidebar" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="logo" href="#/" aria-label="HN Tube home">
        <svg class="logo-mark" viewBox="0 0 32 24" aria-hidden="true">
          <rect width="32" height="24" rx="7" fill="var(--accent)"/>
          <path d="M13 7.2v9.6l8-4.8z" fill="#fff"/>
        </svg>
        <span class="logo-word">HN<span>Tube</span></span>
      </a>
    </div>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" placeholder="Search videos, channels…" autocomplete="off" aria-label="Search videos">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </form>
    <div class="topbar-end">
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Categories"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main id="main" tabindex="-1">
      <div class="grid skeleton" aria-hidden="true">
        <div class="card-skel"></div><div class="card-skel"></div><div class="card-skel"></div>
        <div class="card-skel"></div><div class="card-skel"></div><div class="card-skel"></div>
      </div>
    </main>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
