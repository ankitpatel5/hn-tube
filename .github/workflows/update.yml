name: Daily refresh

on:
  schedule:
    - cron: '17 7 * * *' # every day, 07:17 UTC
  workflow_dispatch: # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write # commit the refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the past year of HN video stories
        run: node scripts/update.mjs

      # Keeping the data in git gives a history of daily snapshots and lets the oEmbed cache carry over.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily refresh $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
